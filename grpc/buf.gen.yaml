# The Go bindings of the Sensive annotations (sensive/v1), generated into gen/
# from the protos this module ships, proto/, and nothing else: the Sensive
# annotations module, which a service compiles its own protos against too.
# Only the annotations are generated; the taxonomy beside them is there to
# compile them, and its Go types are the client module's, which the files'
# Go packages name. Run as `buf generate proto --path proto/sensive/v1`.
version: v2
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
